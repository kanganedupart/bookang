  <body>
    <header>
      <div>
        <h1>교재관리</h1>
        <small>입고·배부·회수와 재고 전후를 한 화면에서 확인</small>
      </div>
      <div id="periodBar"></div>
      <div id="actor"></div>
    </header>
    <main class="wrap">
      <nav class="tabs" id="tabs"></nav>
      <nav id="subtabsHost"></nav>
      <div id="screen"></div>
    </main>
    <div id="appDialogHost"></div>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBIcLrQsEJGmFeikWc4afibUhlWBQkaENw",
        authDomain: "refund-book.firebaseapp.com",
        databaseURL:
          "https://refund-book-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "refund-book",
        storageBucket: "refund-book.firebasestorage.app",
        messagingSenderId: "675243179974",
        appId: "1:675243179974:web:ffad30acbcd63741bc4db0",
      };
      firebase.initializeApp(firebaseConfig);
      // 로컬 테스트와 GitHub 운영 화면이 같은 자료를 사용한다.
      // 실전 전환 시 코드를 바꾸지 않고 이 저장소 안에 새 대상을 만든다.
      // Production always uses the canonical dataset.  A separate dataset may
      // only be selected from localhost so end-to-end tests cannot accidentally
      // redirect the published app to a test database.
      const localDataset = new URLSearchParams(location.search).get("dataset");
      const dataset = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && localDataset
        ? localDataset
        : "bookflowLiteValidation700";
      const root = firebase.database().ref(dataset);
      let S = { books: {}, classes: {}, students: {}, movements: {} },
        tab = "학생",
        view = "student",
        selected = [],
        receipt = null;
      const savedLoginValid = !!localStorage.getItem("bookflowStaffName");
      if (!savedLoginValid) {
        localStorage.removeItem("bookflowStaffName");
        localStorage.removeItem("bookflowStaffRole");
        localStorage.removeItem("bookflowStaffLoginUntil");
      }
      let actor = savedLoginValid
          ? localStorage.getItem("bookflowStaffName") || ""
          : "",
        actorRole = savedLoginValid
          ? localStorage.getItem("bookflowStaffRole") || ""
          : "";
      function renderActor() {
        document.querySelector("#actor").innerHTML = actor
          ? `<b>${esc(actor)}</b><button class="${tab === "관리" ? "settings-on" : ""}" onclick="changeTab('관리')" title="관리">⚙ 관리</button><button onclick="staffLogout()">로그아웃</button>`
          : "직원 로그인 필요";
      }
      function esc(v) {
        return String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function dialogText(value) {
        return String(value ?? "")
          .replace(/\s*·?\s*처리번호\s+[A-Za-z0-9-]+/g, "")
          .trim();
      }
      function closeAppDialog(result) {
        const host = document.querySelector("#appDialogHost"),
          resolve = window.appDialogResolve;
        if (host) host.innerHTML = "";
        window.appDialogResolve = null;
        if (resolve) resolve(result);
      }
      function showNotice(message) {
        const host = document.querySelector("#appDialogHost");
        if (!host) return;
        host.innerHTML = `<div class="app-dialog-backdrop" role="presentation"><section class="app-dialog" role="alertdialog" aria-modal="true" aria-labelledby="appDialogTitle"><h2 id="appDialogTitle">알림</h2><div class="app-dialog-message">${esc(dialogText(message))}</div><div class="app-dialog-actions"><button class="confirm-button" onclick="closeAppDialog(true)">확인</button></div></section></div>`;
        requestAnimationFrame(() =>
          host.querySelector(".confirm-button")?.focus(),
        );
      }
      function askConfirm(message) {
        const host = document.querySelector("#appDialogHost");
        if (!host) return Promise.resolve(false);
        return new Promise((resolve) => {
          window.appDialogResolve = resolve;
          host.innerHTML = `<div class="app-dialog-backdrop" role="presentation"><section class="app-dialog" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle"><h2 id="appDialogTitle">확인</h2><div class="app-dialog-message">${esc(dialogText(message))}</div><div class="app-dialog-actions"><button onclick="closeAppDialog(false)">취소</button><button class="confirm-button" onclick="closeAppDialog(true)">확인</button></div></section></div>`;
          requestAnimationFrame(() =>
            host.querySelector(".confirm-button")?.focus(),
          );
        });
      }
      function askPrompt(title, initialValue = "", inputType = "text") {
        const host = document.querySelector("#appDialogHost");
        if (!host) return Promise.resolve(null);
        return new Promise((resolve) => {
          window.appDialogResolve = resolve;
          host.innerHTML = `<div class="app-dialog-backdrop" role="presentation"><section class="app-dialog" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle"><h2 id="appDialogTitle">${esc(title)}</h2><div class="app-dialog-message"><input id="appDialogInput" type="${esc(inputType)}" value="${esc(initialValue)}" autocomplete="off"></div><div class="app-dialog-actions"><button onclick="closeAppDialog(null)">취소</button><button class="confirm-button" onclick="closeAppDialog(document.getElementById('appDialogInput').value)">확인</button></div></section></div>`;
          const input = host.querySelector("#appDialogInput");
          input?.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.isComposing) {
              event.preventDefault();
              closeAppDialog(input.value);
            }
          });
          requestAnimationFrame(() => {
            input?.focus();
            input?.select();
          });
        });
      }
      window.alert = showNotice;
      let searchTimer = null;
      function studentSearchKey(value) {
        return String(value || "")
          .normalize("NFKC")
          .toLowerCase()
          .replace(/\s+/g, "");
      }
      function normalizeNameKey(value) {
        return String(value || "")
          .normalize("NFKC")
          .trim()
          .toLocaleLowerCase("ko")
          .replace(/\s+/g, " ");
      }
      function normalizedStudentName(studentOrName) {
        const rawName = String(
          typeof studentOrName === "object" && studentOrName
            ? studentOrName.name
            : studentOrName || "",
        ).normalize("NFKC").trim();
        const withoutLegacyPrefix = rawName
          .replace(/^\([^)]*\)/, "")
          .replace(/\s+/g, "");
        const nameOnly = /^[가-힣]{2,5}\d{3,6}$/.test(withoutLegacyPrefix)
          ? withoutLegacyPrefix.replace(/\d{3,6}$/, "")
          : withoutLegacyPrefix;
        return nameOnly.toLowerCase();
      }
      function studentNameIdentityKey(studentOrName) {
        const normalizedName = normalizedStudentName(studentOrName);
        return normalizedName ? `name:${normalizedName}` : "";
      }
      function normalizeExternalId(value) {
        return String(value ?? "").normalize("NFKC").trim();
      }
      function studentIdentityKey(student) {
        const externalId = normalizeExternalId(student?.externalId);
        if (externalId) return `external:${externalId}`;
        const normalizedName = normalizedStudentName(student);
        return normalizedName ? `name:${normalizedName}` : `id:${String(student?.id || "")}`;
      }
      function preferredStudentRecord(a, b, pid = selectedPeriodId()) {
        const score = (student) =>
          Object.keys(student?.periodClasses?.[pid] || {}).length * 1000 +
          Object.keys(student?.holdings || {}).length * 10 +
          (student?.externalId ? 2 : 0) +
          (student?.active !== false ? 1 : 0);
        return score(b) > score(a) ? b : a;
      }
      function matchingStudents(q, includeInactive = false) {
        q = studentSearchKey(q);
        if (q.length < 2) return [];
        const uniqueStudents = new Map();
        for (const student of arr(S.students).filter(
          (s) =>
            (includeInactive || s.active !== false) &&
            studentSearchKey(s.name).includes(q),
        )) {
          const key = studentIdentityKey(student);
          const existing = uniqueStudents.get(key);
          uniqueStudents.set(
            key,
            existing ? preferredStudentRecord(existing, student) : student,
          );
        }
        return [...uniqueStudents.values()]
          .sort((a, b) => {
            const ak = studentSearchKey(a.name),
              bk = studentSearchKey(b.name),
              ar = ak === q ? 0 : ak.startsWith(q) ? 1 : 2,
              br = bk === q ? 0 : bk.startsWith(q) ? 1 : 2;
            return ar - br || a.name.localeCompare(b.name, "ko");
          })
          .slice(0, 30);
      }
      function studentResultButtons(rows, selectFn) {
        return rows
          .map(
            (s) =>
              `<button onclick="${selectFn}('${s.id}')" title="${esc(s.name)}"><b>${esc(s.name)}</b></button>`,
          )
          .join("");
      }
      function autoStudentSearch(input, resultId, mode) {
        clearTimeout(searchTimer);
        const q = input.value,
          box = document.getElementById(resultId);
        if (!box) return;
        const normalized = studentSearchKey(q);
        const rows = normalized.length >= 2
          ? matchingStudents(q, mode === "status")
          : [];
        box.innerHTML = normalized.length >= 2
          ? rows.length
            ? studentResultButtons(
                rows,
                {
                  process: "selectProcessStudent",
                  status: "selectStatusStudent",
                  edit: "selectEditStudent",
                }[mode],
              )
            : '<p class="error">검색된 학생이 없습니다.</p>'
          : "";
      }
      function handleStudentStatusSearch(input) {
        window.studentQuery = input.value;
        window.statusStudentId = "";
        const box = document.getElementById("studentStatusAutoResults"),
          query = studentSearchKey(input.value);
        if (!box) return;
        if (query.length < 2) {
          box.innerHTML = "";
          return;
        }
        const rows = matchingStudents(input.value, true);
        box.innerHTML = rows.length
          ? studentResultButtons(rows, "selectStatusStudent")
          : '<p class="error">검색된 학생이 없습니다.</p>';
      }
      function confirmStudentSearch(input, resultId, mode) {
        const rows = matchingStudents(input.value, mode === "status");
        if (rows.length === 1) {
          ({
            process: selectProcessStudent,
            status: selectStatusStudent,
            edit: selectEditStudent,
          })[mode](rows[0].id);
          return;
        }
        autoStudentSearch(input, resultId, mode);
      }
      function confirmBookSearch(event) {
        if (event.key !== "Enter" || event.isComposing) return;
        event.preventDefault();
        const rows = matchingBooksForPicker(event.currentTarget.value);
        if (rows.length === 1) selectBookStatus(rows[0].id);
      }
      function selectProcessStudent(id) {
        window.sid = id;
        window.processStudentQuery = S.students[id]?.name || "";
        selected = [];
        render();
      }
      function selectStatusStudent(id) {
        window.statusStudentId = id;

        const message = dateKey
          ? `${periodLabel(period)}의 환불 적용 시작일을 ${dateKey}로 저장할까요? 이 날짜를 포함해 이후 퇴반한 학생만 자동 환불대기에 들어갑니다.`
          : `${periodLabel(period)}의 환불 적용 시작일을 삭제할까요? 삭제하면 날짜가 확인된 모든 퇴반이 환불대상이 될 수 있습니다.`;

          ))

              };
            });
document.querySelector("#screen").innerHTML = `<section class="panel"><h2>환불 <span class="badge ${pendingRefundCount() ? "warn" : "ok"}">대기 ${pendingRefundCount()}명</span></h2><p class="muted">목록에는 학생별 미배부 종수와 환불금액만 표시합니다. 교재명·수량·단가는 상세 확인에서 확인하며, 환불완료 전에는 재고와 학생 보유수량이 바뀌지 않습니다.</p><div class="filter-row"><label>대상<select onchange="refundPeriodFilter=this.value;refundTaskScreen()"><option value="ACTIVE_ALL">운영 대상 전체</option>${arr(S.periods).filter((period) => activeIds.has(period.id)).map((period) => `<option value="${period.id}" ${periodFilter === period.id ? "selected" : ""}>${esc(periodLabel(period))}</option>`).join("")}</select></label><label>상태<select onchange="refundStatus=this.value;refundTaskScreen()"><option value="PENDING" ${status === "PENDING" ? "selected" : ""}>환불대기</option><option value="DONE" ${status === "DONE" ? "selected" : ""}>환불완료</option><option value="ALL" ${status === "ALL" ? "selected" : ""}>전체</option></select></label><label>통합검색<input value="${esc(window.refundQuery || "")}" placeholder="학생명 검색" oninput="refundQuery=this.value;refundTaskScreen()"></label></div><p>검색 결과 ${rows.length}명</p><div class="scroll"><table><thead><tr><th>퇴반일</th><th>대상</th><th>학생</th><th>미배부 종수</th><th>환불 금액</th><th>상태</th><th>확인</th></tr></thead><tbody>${rows.map((task) => `<tr><td>${task.exitDate ? esc(task.exitDate) : `<span class="badge warn">확인 필요</span><small>감지 ${esc(fmt(task.createdAt))}</small>`}</td><td><b>${esc(deskPeriodName(task.periodId))}</b></td><td><b>${esc(task.studentName || S.students?.[task.studentId]?.name || "")}</b><small><span class="badge" style="background:#fde8e7;color:#9b3b35">퇴반</span></small></td><td><b>${task.refundBookCount}종</b></td><td><b>${task.refundAmountMissing ? "확정 불가" : won(task.refundAmount)}</b>${task.refundAmountMissing ? `<small class="error">금액 미등록 ${task.refundMissingPriceCount}종</small>` : ""}</td><td>${task.status !== "DONE" ? '<span class="badge" style="background:#eceff2;color:#66707a">환불대기</span>' : '<span class="badge" style="background:#e6f2eb;color:#357454">환불완료</span>'}</td><td><button onclick="openRefundStudent('${task.studentId}','${task.periodId || ""}')">상세 확인</button></td></tr>`).join("") || '<tr><td colspan="7">해당 환불 학생이 없습니다.</td></tr>'}</tbody></table></div></section>`;
      }
      function refundConfirmationSnapshot(state, task) {
        if (!task) return null;
        const books = Object.values(task.books || {})
          .filter((book) => book.status === "PENDING")
          .map((book) => {
            const quantity = Number(book.quantity == null ? 1 : book.quantity),
              unitPrice = bookPriceValue(state.books?.[book.bookId]);
            if (!Number.isInteger(quantity) || quantity < 1 || unitPrice == null)
              return null;
            return {
              bookId: String(book.bookId || ""),
              quantity,
              unitPrice,
              amount: unitPrice * quantity,
            };
          });
        if (books.some((book) => !book)) return null;
        books.sort((a, b) => a.bookId.localeCompare(b.bookId));
        return {
          books,
          signature: JSON.stringify({
            taskId: task.id,
            periodId: task.periodId || "",
            studentId: task.studentId || "",
            status: task.status,
            books,
          }),
        };
      }
      async function completeRefund(sid) {
        const task = refundTaskForStudent(sid),
          confirmation = refundConfirmationSnapshot(S, task),
          pendingBooks = Object.values(task?.books || {}).filter(
            (book) => book.status === "PENDING",
          ),
          pricedBooks = pendingBooks.map((item) => ({
            ...item,
            unitPrice: bookPriceValue(S.books?.[item.bookId]),
            quantity: Math.max(1, Number(item.quantity || 1)),
          })),
          missingPrices = pricedBooks.filter((item) => item.unitPrice == null),
          totalAmount = pricedBooks.reduce(
            (sum, item) =>
              sum + Number(item.unitPrice || 0) * Number(item.quantity || 1),
            0,
          );
        if (!task)
          return alert("환불대기 교재가 없습니다.");
        if (task.status !== "PENDING")
          return alert(
            task.status === "CANCELLED"
              ? "재등록으로 종결된 환불대기입니다. 환불완료로 처리할 수 없습니다."
              : "이미 환불완료로 처리했습니다.",
          );
        if (!confirmation)
          return alert("환불완료 차단: 교재 수량 또는 금액이 올바르지 않습니다. 다시 확인하세요.");
        if (missingPrices.length)
          return alert(`교재비 미등록으로 환불완료할 수 없습니다.\n\n${missingPrices.map((book) => book.bookName).join("\n")}\n\n관리의 반·교재에서 금액을 먼저 입력하세요.`);
        if (!(await askConfirm(`${S.students?.[sid]?.name || task.studentName} 학생의 환불을 완료할까요?\n\n${pricedBooks.map((book) => `${book.bookName} · ${book.quantity}권 × ${won(book.unitPrice)} = ${won(book.unitPrice * book.quantity)}`).join("\n")}\n\n환불 총액 ${won(totalAmount)}\n\n재고와 학생 보유수량은 변경되지 않습니다.`)))
          return;
        const completedAt = now(),
          r = await transaction((st) => {
            st.refundTasks = st.refundTasks || {};
            const target = st.refundTasks[task.id];
            if (!target || target.status !== "PENDING") return false;
            const latestConfirmation = refundConfirmationSnapshot(st, target);
            if (!latestConfirmation || latestConfirmation.signature !== confirmation.signature)
              return false;
            const names = [],
              bookAmounts = [];
            for (const book of Object.values(target.books || {})) {
              if (book.status !== "PENDING") continue;
              const currentPrice = bookPriceValue(st.books?.[book.bookId]);
              if (currentPrice == null) return false;
              const quantity = Math.max(1, Number(book.quantity || 1));
              book.status = "DONE";
              book.completedAt = completedAt;
              book.completedBy = actor;
              book.unitPrice = currentPrice;
              book.quantity = quantity;
              book.refundAmount = currentPrice * quantity;
              names.push(book.bookName);
              bookAmounts.push({
                bookId: book.bookId,
                bookName: book.bookName,
                unitPrice: currentPrice,
                quantity,
                amount: currentPrice * quantity,
              });
            }
            target.status = "DONE";
            target.completedAt = completedAt;
            target.completedBy = actor;
            target.totalAmount = bookAmounts.reduce(
              (sum, item) => sum + item.amount,
              0,
            );
            st.refundHistory = st.refundHistory || {};
            const hid = "RH" + crypto.randomUUID();
            st.refundHistory[hid] = {
              id: hid,
              type: "환불완료",
              taskId: target.id,
              periodId: target.periodId,
              studentId: target.studentId,
              studentName: target.studentName,
              bookNames: names,
              bookAmounts,
              quantity: bookAmounts.reduce(
                (sum, item) => sum + Number(item.quantity || 0),
                0,
              ),
              totalAmount: target.totalAmount,
              actor,
              time: completedAt,
              memo: `환불 교재 ${bookAmounts.reduce((sum, item) => sum + Number(item.quantity || 0), 0)}권 · ${won(target.totalAmount)} 환불완료`,
            };
          });
        if (!r.committed)
          return alert("이미 처리됐거나 환불항목이 변경됐습니다.");
        S = r.snapshot.val();
        alert("환불완료로 기록했습니다. 재고와 학생 보유수량은 변경하지 않았습니다.");
        studentStatus();
      }
      const studentStatusBeforeReenrollmentBadge = studentStatus;
      studentStatus = function () {
        studentStatusBeforeReenrollmentBadge();
        const student = S.students?.[window.statusStudentId || ""],
          task = student && refundTaskForStudent(student.id);
        if (task?.status !== "CANCELLED") return;
        const heading = document.querySelector("#studentDetail .student-head h2");
        if (heading)
          heading.insertAdjacentHTML(
            "beforeend",
            ' <span class="badge" style="background:#fff2cc;color:#7a5a00">재등록 종결</span>',
          );
      };
      const refundTaskScreenBeforeCancelled = refundTaskScreen;
      refundTaskScreen = function () {
        refundTaskScreenBeforeCancelled();
        const statusSelect = document.querySelector(
          'select[onchange="refundStatus=this.value;refundTaskScreen()"]',
        );
        if (statusSelect && !statusSelect.querySelector('option[value="CANCELLED"]')) {
          const option = document.createElement("option");
          option.value = "CANCELLED";
          option.textContent = "재등록 종결";
          statusSelect.insertBefore(option, statusSelect.lastElementChild);
          statusSelect.value = window.refundStatus || "PENDING";
        }
        for (const row of document.querySelectorAll("#screen tbody tr")) {
          const onclick = row.querySelector("button")?.getAttribute("onclick") || "",
            match = onclick.match(/openRefundStudent\('([^']+)'\s*,\s*'([^']*)'/);
          if (!match) continue;
          const task = arr(S.refundTasks).find(
            (item) => item.studentId === match[1] && item.periodId === match[2],
          );
          if (task?.status === "CANCELLED")
            row.cells[4].innerHTML =
              '<span class="badge" style="background:#fff2cc;color:#7a5a00">재등록 종결</span>';
        }
      };
      function histApply() {
        const fromInput = document.getElementById("histFrom"),
          toInput = document.getElementById("histTo"),
          typeInput = document.getElementById("histType"),
          reasonInput = document.getElementById("histReason"),
          memoInput = document.getElementById("histMemoOnly"),
          searchInput = document.getElementById("histSearch"),
          countBox = document.getElementById("histCount"),
          body = document.getElementById("hist");
        if (!fromInput || !toInput || !typeInput || !reasonInput || !memoInput || !searchInput || !countBox || !body)
          return;
        window.histFrom = fromInput.value;
        window.histTo = toInput.value;
        window.histType = typeInput.value;
        window.histReason = reasonInput.value;
        window.histMemoOnly = memoInput.value;
        window.histQuery = searchInput.value;
        const from = fromInput.value
            ? new Date(fromInput.value + "T00:00:00").getTime()
            : 0,
          to = toInput.value
            ? new Date(toInput.value + "T23:59:59.999").getTime()
            : Infinity,
          q = searchInput.value.trim().toLowerCase();
        const rows = allHistory()
          .filter((m) => {
            const t = new Date(m.time).getTime(),
              type =
                {
                  IN: "IN",
                  DISTRIBUTE: "DISTRIBUTE",
                  RETURN: "RETURN",
                  ADJUST: "ADJUST",
                }[m.type] || m.type,
              hay = [
                movementNames(m).join(" "),
                arr(m.classNames).join(" "),
                m.className,
                m.studentName,
                movementBookName(m),
                m.actor,
                m.memo,
                m.batchId,
              ]
                .join(" ")
                .toLowerCase();
            return (
              t >= from &&
              t <= to &&
              (!typeInput.value || type === typeInput.value) &&
              (!reasonInput.value ||
                (m.businessReason || "NORMAL") === reasonInput.value) &&
              (!memoInput.value || String(m.memo || "").trim()) &&
              (!q || hay.includes(q))
            );
          })
          .slice(0, 1000);
        countBox.textContent = `검색 결과 ${rows.length}건${rows.length === 1000 ? " (최근 1,000건까지만 표시)" : ""}`;
        body.innerHTML = rows
          .map((m) => {
            const names = movementNames(m),
              classes = uniq(arr(m.classNames)),
              who =
                m.studentName ||
                (classes.length === 1 && names.length > 1
                  ? `${classes[0]} · ${names.length}명`
                  : classes.length > 1 && names.length > 1
                    ? `${classes[0]} 외 ${classes.length - 1}개 반 · ${names.length}명`
                    : names.length > 1
                      ? `${names[0]} 외 ${names.length - 1}명`
                      : names.join(", ")) ||
                "-",
              flow =
                m.stockBefore == null
                  ? "-"
                  : `${m.stockBefore} → ${m.stockAfter}`;
            const reason =
                {
                  NORMAL: "일반",
                  FREE: "무료배부",
                  EXTRA_PAYMENT: "추가결제 필요",
                  CLASS_MOVE: "반변경",
                  MISDISTRIBUTION: "실수",
                  OTHER: "기타",
                }[m.businessReason || "NORMAL"] || "",
              qty = Math.abs(Number(m.quantity || m.itemCount || 0));
            return `<tr><td>${fmt(m.time)}</td><td><b>${esc({ IN: "입고", DISTRIBUTE: m.mode === "ADDITIONAL" ? "추가배부" : "배부", RETURN: "회수", ADJUST: "조정" }[m.type] || m.type)}</b><small>${esc(reason)}</small></td><td title="${esc(names.join(", "))}">${esc(who)}</td><td>${esc(movementBookName(m))}<small>${qty ? `${qty}권` : ""}</small></td><td><b>${flow}</b></td><td>${esc(m.actor || "-")}</td><td title="${esc(m.memo || "")}">${m.memo ? `<b>메모 있음</b><small>${esc(m.memo)}</small>` : "-"}</td></tr>`;
          })
          .join("");
      }
    </script>
  </body>
